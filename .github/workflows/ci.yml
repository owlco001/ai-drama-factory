# ai-drama-factory CI
# 阶段1 ③：构建 + 测试，并强制「静态 @Test 声明数 == XML 实际执行数」
# 这是本项目专属止血带——JUnit Jupiter 会静默丢弃编译为非 void 的 @Test（不报错、不计 skipped、构建仍绿），
# 导致「构建通过」≠「测试真的跑了」。用此断言把这类假绿拦在 CI。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------- 纯 JVM 引擎：可在无 Android SDK 环境跑，覆盖 silent-drop 回归 ----------
  core-engine-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-ai-drama
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Run core-engine tests
        run: ./gradlew :core-engine:test --no-daemon

      - name: Assert declared @Test count == executed count
        run: |
          DECLARED=$(grep -rhoE '^\s*@Test' core-engine/src/test | wc -l | tr -d ' ')
          EXECUTED=$(find core-engine/build/test-results -name 'TEST-*.xml' -exec grep -hoE '<testcase' {} + | wc -l | tr -d ' ')
          echo "::group::Test sanity gate"
          echo "Declared @Test annotations : $DECLARED"
          echo "Executed <testcase> elements: $EXECUTED"
          echo "::endgroup::"
          if [ "$DECLARED" != "$EXECUTED" ]; then
            echo "::error::JUnit silently dropped test(s)! declared=$DECLARED executed=$EXECUTED — 检查是否有 @Test 方法被 Kotlin 编译成非 void（如末句有返回值）"
            exit 1
          fi
          if [ "$EXECUTED" -eq 0 ]; then
            echo "::error::0 tests executed — 流水线形同虚设"
            exit 1
          fi
          echo "OK: 全部 @Test 均被实际执行"

  # ---------- Android 壳：需要 Android SDK，验证 apk 能出、app 测试不静默丢 ----------
  android-app:
    runs-on: ubuntu-latest
    needs: core-engine-tests
    defaults:
      run:
        working-directory: src-ai-drama
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Assemble debug APK (build success gate)
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Run app unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Assert app @Test count == executed count
        run: |
          DECLARED=$(grep -rhoE '^\s*@Test' app/src/test | wc -l | tr -d ' ')
          EXECUTED=$(find app/build/test-results -name 'TEST-*.xml' -exec grep -hoE '<testcase' {} + | wc -l | tr -d ' ')
          echo "::group::App test sanity gate"
          echo "Declared @Test annotations : $DECLARED"
          echo "Executed <testcase> elements: $EXECUTED"
          echo "::endgroup::"
          if [ "$DECLARED" != "$EXECUTED" ]; then
            echo "::error::App: JUnit silently dropped test(s)! declared=$DECLARED executed=$EXECUTED"
            exit 1
          fi
          if [ "$EXECUTED" -eq 0 ]; then
            echo "::error::App: 0 tests executed"
            exit 1
          fi
          echo "OK: app 全部 @Test 均被实际执行"
