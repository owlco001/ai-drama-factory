<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
body{margin:0;font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:#0D0A1A;color:#E8DDF5;
display:flex;flex-direction:column;align-items:center;justify-content:center;width:1280px;height:640px;}
h1{font-size:72px;margin:0;background:linear-gradient(90deg,#C9A7F5,#7FD4C1);-webkit-background-clip:text;color:transparent;}
p.tag{font-size:28px;color:#9D8FB8;margin:16px 0 40px;letter-spacing:2px;}
.flow{display:flex;gap:14px;align-items:center;font-size:24px;}
.step{background:#1A1030;border:1px solid #3A2B5C;border-radius:12px;padding:18px 26px;text-align:center;}
.arrow{color:#5C4A8A;font-size:30px;}
.badges{margin-top:44px;display:flex;gap:12px;}
.badge{font-size:16px;padding:6px 16px;border-radius:20px;border:1px solid #5C4A8A;color:#C9A7F5;}
</style></head><body>
<h1>AI短剧工厂</h1>
<p class="tag">一枝独秀不是春，百花齐放更添香。开源你的梦境。</p>
<div class="flow">
<div class="step">📖 小说/剧本</div><div class="arrow">→</div>
<div class="step">🎭 AI 资产提取</div><div class="arrow">→</div>
<div class="step">🎬 AI 编剧导演分镜</div><div class="arrow">→</div>
<div class="step">▶️ 渲染成片</div>
</div>
<div class="badges">
<span class="badge">v1.0.0</span><span class="badge">MIT License</span>
<span class="badge">质量闸门 G1+G2</span><span class="badge">六铁律 · 忠实性校验</span><span class="badge">Android</span>
</div>
</body></html>
